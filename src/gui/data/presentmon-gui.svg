<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- presentmon-gui: a frame-time trace with one spike on a dark rounded tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a4e"/>
      <stop offset="1" stop-color="#16202c"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3daee9"/>
      <stop offset="1" stop-color="#1cdc9a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="11" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <line x1="10" y1="22" x2="54" y2="22"/>
    <line x1="10" y1="34" x2="54" y2="34"/>
    <line x1="10" y1="46" x2="54" y2="46"/>
  </g>
  <polyline points="10,40 15,39 19,41 23,38 27,40 31,39 34,40 36,17 38,40 42,38 46,40 50,39 54,40"
            fill="none" stroke="url(#trace)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="36" cy="17" r="2.6" fill="#f67400"/>
</svg>
